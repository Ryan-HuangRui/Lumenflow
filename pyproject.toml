[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenflow"
version = "0.1.0"
description = "Local-first photo workflow contracts and deterministic helper tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Lumenflow contributors"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["lumenflow*"]

[tool.ruff]
target-version = "py311"
